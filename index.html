<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
  <link href="https://fonts.googleapis.com/css?family=Poppins:200i,300,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Raleway:700&display=swap" rel="stylesheet">
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
    }
    
    /* Navbar */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: #333;
      color: white;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
    }
    .nav-list {
      list-style: none;
      display: flex;
    }
    .nav-list li {
      margin: 0 10px;
    }
    .nav-list a {
      text-decoration: none;
      color: white;
    }
    
    /* Responsive Navbar */
    @media (max-width: 768px) {
      .nav-list {
        display: none;
        flex-direction: column;
        background: #333;
        position: absolute;
        top: 50px;
        right: 0;
        width: 100%;
        text-align: center;
      }
      .nav-list.show {
        display: flex;
      }
      .menu-toggle {
        display: block;
        cursor: pointer;
      }
    }
    
    /* Welcome Section */
    .welcome-section {
      text-align: center;
      padding: 100px 20px;
    }
    
    /* Projects Section */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .project {
      text-align: center;
      background: #f3f3f3;
      padding: 10px;
      border-radius: 10px;
    }
    .project img {
      width: 100%;
      border-radius: 5px;
    }
    
    /* Contact Section */
    .contact-section {
      text-align: center;
      padding: 50px 20px;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 10px;
      background: #333;
      color: white;
    }
  </style>
</head>
<body>
  <nav id="navbar" class="nav">
    <div class="menu-toggle">☰</div>
    <ul class="nav-list">
      <li><a href="#welcome-section">About</a></li>
      <li><a href="#projects">Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  
  <section id="welcome-section" class="welcome-section">
    <h1>Hi, Saya Avit Ferdiansyah</h1>
    <p>Saya seorang Web Developer</p>
  </section>
  
  <section id="projects" class="projects-section">
    <h2>Ini adalah beberapa project saya</h2>
    <div class="projects-grid">
      <div class="project">
        <img src="https://cdn.freecodecamp.org/testable-projects-fcc/images/tribute.jpg" alt="project">
        <p>Tribute Page</p>
      </div>
      <div class="project">
        <img src="https://cdn.freecodecamp.org/testable-projects-fcc/images/random-quote-machine.png" alt="project">
        <p>Random Quote Machine</p>
      </div>
    </div>
  </section>
  
  <section id="contact" class="contact-section">
    <h2>Mari Bekerja Sama Dengan Saya</h2>
    <a href="mailto:avitferdiansyahv22@gmail.com">Email Saya</a>
  </section>
  
  <footer>
    <p>Ini hanya portfolio modifan source asli dari freeCodeCamp</p>
  </footer>
  
  <script>
    document.querySelector('.menu-toggle').addEventListener('click', () => {
      document.querySelector('.nav-list').classList.toggle('show');
    });
  </script>
</body>
</html>
